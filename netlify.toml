[build]
  command = "npm run build"
  publish = "dist"

# Proxy Firebase Auth handler to prevent cross-origin cookie loss
[[redirects]]
  from = "/__/auth/*"
  to = "https://muradgraphics-f6d59.firebaseapp.com/__/auth/:splat"
  status = 200
  force = true

# Single Page App (SPA) redirect rule
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache control headers for index.html to ensure visitors always load latest updates
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Cache control headers for static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security & CORS headers that allow Firebase Popups to communicate with opener
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    X-Content-Type-Options = "nosniff"
